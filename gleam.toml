name = "tankobon"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
modem = ">= 2.1.3 and < 3.0.0"
lustre = ">= 5.7.0 and < 6.0.0"
lustre_dev_tools = ">= 2.3.6 and < 3.0.0"
plinth = ">= 0.10.2 and < 1.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
formal = ">= 3.0.1 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[tools.lustre.dev]
proxy = { from = "/api", to = "http://localhost:5505/api" }

[tools.lustre.html]
stylesheets = [
    {href = "https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"},
    {href = "https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"},
    {href = "https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"}
]
title = "Tankobon"
body = '<div id="app" class="flex flex-col w-screen h-screen overflow-hidden dark text-white bg-zinc-900"></div>'
